<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Финансовый Трекер</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --card: #f4f4f4;
      --accent: #007aff;
    }

    [data-theme="dark"] {
      --bg: #121212;
      --text: #ffffff;
      --card: #1e1e1e;
      --accent: #0a84ff;
    }

    body {
      margin: 0;
      padding: 1rem;
      background-color: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    h1 {
      text-align: center;
      margin-bottom: 1rem;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    input, button, select {
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }

    button {
      background: var(--accent);
      color: white;
      cursor: pointer;
      transition: 0.3s ease;
      border: none;
    }

    button:hover {
      opacity: 0.9;
    }

    .transaction-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .transaction-item {
      padding: 0.5rem 0;
      border-bottom: 1px solid #ccc;
    }

    #message {
      margin-bottom: 1rem;
      padding: 0.5rem;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      background-color: #d4edda;
      color: #155724;
    }

    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <h1>Финансовый Трекер</h1>
  <div id="stats" style="margin: 10px 0; font-size: 16px;"></div>
  <div id="message" style="display: none;"></div>

  <div class="card">
    <div class="input-group">
      <label for="type">Тип транзакции</label>
      <select id="type">
        <option value="income">Доход</option>
        <option value="expense">Расход</option>
      </select>

      <label for="category">Категория</label>
      <select id="categorySelect"></select>
      <input type="text" id="newCategory" placeholder="Новая категория (опц.)" />

      <input type="text" id="description" placeholder="Описание" />
      <input type="number" id="amount" placeholder="Сумма" />
      <button onclick="addTransaction()">Добавить</button>
    </div>
  </div>

  <div class="card">
    <h3>История транзакций</h3>
    <ul class="transaction-list" id="transactionList"></ul>
  </div>

  <script>
    const API_BASE = "https://fintracker-51hz.onrender.com/api";

    function showMessage(text, type = "success") {
      const el = document.getElementById("message");
      el.textContent = text;
      el.className = type;
      el.style.display = "block";
      setTimeout(() => {
        el.style.display = "none";
      }, 3000);
    }

    async function fetchCategories() {
      try {
        const res = await fetch(`${API_BASE}/get_categories/`);
        const data = await res.json();
        const select = document.getElementById("categorySelect");
        select.innerHTML = "";
        data.forEach(cat => {
          const option = document.createElement("option");
          option.value = cat.name;
          option.textContent = cat.name;
          select.appendChild(option);
        });
      } catch (e) {
        console.error("Ошибка загрузки категорий", e);
      }
    }

    async function addTransaction() {
      const type = document.getElementById("type").value;
      const amount = parseFloat(document.getElementById("amount").value);
      const description = document.getElementById("description").value.trim();
      const selectedCategory = document.getElementById("categorySelect").value;
      const newCategory = document.getElementById("newCategory").value.trim();
      const category = newCategory || selectedCategory;

      if (!description || isNaN(amount) || amount <= 0) {
        showMessage("Введите корректные данные", "error");
        return;
      }

      try {
        if (newCategory) {
          await fetch(`${API_BASE}/create_category/`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: newCategory })
          });
          await fetchCategories();
        }

        const res = await fetch(`${API_BASE}/add_transaction/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            type,
            amount,
            category,
            comment: description
          })
        });

        if (res.ok) {
          document.getElementById("amount").value = "";
          document.getElementById("description").value = "";
          document.getElementById("newCategory").value = "";
          showMessage("Транзакция добавлена!", "success");
          await loadStats();
          await loadTransactions();
        } else {
          showMessage("Ошибка при добавлении транзакции", "error");
        }
      } catch (e) {
        showMessage("Сетевая ошибка", "error");
      }
    }

    async function loadStats() {
      try {
        const res = await fetch(`${API_BASE}/get_stats/`);
        const stats = await res.json();
        const el = document.getElementById("stats");
        el.innerHTML = `
          <b>Доход:</b> ${stats.income} ₽<br>
          <b>Расход:</b> ${stats.expense} ₽
        `;
      } catch (e) {
        showMessage("Ошибка загрузки статистики", "error");
      }
    }

    async function loadTransactions() {
      try {
        const res = await fetch(`${API_BASE}/get_transactions/`);
        const data = await res.json();
        const list = document.getElementById("transactionList");
        list.innerHTML = "";
        data.forEach(tx => {
          const li = document.createElement("li");
          li.className = "transaction-item";
          li.textContent = `${tx.type === 'income' ? '➕' : '➖'} ${tx.comment} — ${tx.amount} ₽ [${tx.category}]`;
          list.appendChild(li);
        });
      } catch (e) {
        showMessage("Ошибка загрузки истории", "error");
      }
    }

    // начальная загрузка
    fetchCategories();
    loadStats();
    loadTransactions();
  </script>
</body>
</html>
