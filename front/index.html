<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Финансовый Трекер</title>
  <style>
    body {
      margin: 0;
      padding: 1rem;
      font-family: sans-serif;
      background: #f8f8f8;
      color: #222;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 1rem;
      margin: 1rem 0;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    input, select, button {
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    button {
      background: #007aff;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .transaction-list {
      list-style: none;
      padding: 0;
    }

    .transaction-item {
      padding: 0.5rem 0;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>
<body>

  <h1>Финансовый Трекер</h1>
  <div id="stats" style="margin-bottom: 1rem;"></div>

  <div class="card">
    <div class="input-group">
      <label for="type">Тип</label>
      <select id="type">
        <option value="income">Доход</option>
        <option value="expense">Расход</option>
      </select>

      <input type="text" id="description" placeholder="Описание"/>
      <input type="number" id="amount" placeholder="Сумма"/>

      <button onclick="addTransaction()">Добавить</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    async function addTransaction() {
  const type = document.getElementById("type").value;
  const description = document.getElementById("description").value;
  const amount = parseFloat(document.getElementById("amount").value);

  if (!description || !amount || isNaN(amount)) {
    alert("Введите корректные данные");
    return;
  }

  const data = {
    type,
    amount,
    comment: description,
    category: "default"
  };

  try {
    const res = await fetch("https://fintracker-51hz.onrender.com/api/add_transaction/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    if (res.ok) {
      await res.json(); // ✅ не обязательно использовать, но ошибка уйдёт
      await loadStats();
      tg.close();
    } else {
      const err = await res.json();
      alert("Ошибка при добавлении: " + JSON.stringify(err));
    }
  } catch (err) {
    console.error("Ошибка сети", err);
    alert("Ошибка соединения");
  }
}
async function loadStats() {
  try {
    const res = await fetch("https://fintracker-51hz.onrender.com/api/get_stats/");
    const stats = await res.json();
    const income = stats.income || 0;
    const expense = stats.expense || 0;
    document.getElementById("stats").innerHTML = `
      <strong>Доход:</strong> ${income} ₽<br>
      <strong>Расход:</strong> ${expense} ₽
    `;
  } catch (err) {
    console.error("Ошибка при получении статистики", err);
    document.getElementById("stats").innerText = "Ошибка загрузки статистики";
  }
}


    loadStats();
  </script>
</body>
</html>
